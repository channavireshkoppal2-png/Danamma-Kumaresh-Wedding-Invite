<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Couple Section</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #6A050B;
            --dark-red: #4A0005;
            --bg-maroon: #580308;
            --gold: #C5A059;
            --gold-light: #F3E5AB;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --bg-cream: #FAF8F5;
            --card-cream: #FAF5EE;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cinzel', serif;
            background-color: var(--bg-maroon);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(138, 12, 22, 0.8) 0%, rgba(60, 0, 5, 0.95) 100%),
                radial-gradient(circle at 10% 80%, rgba(20, 0, 2, 0.5) 0%, transparent 50%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        /* --- THE COUPLE SECTION CONTAINER --- */
        .couple-section {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .couple-heading {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            letter-spacing: 5px;
            color: var(--gold-light);
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .couple-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--gold);
            font-size: 0.85rem;
            margin-bottom: 14px;
        }

        .couple-tagline {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.72rem, 2vw, 0.9rem);
            letter-spacing: 3px;
            color: #F8E5BB;
            font-weight: 500;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        /* --- CARDS CONTAINER --- */
        .couple-cards-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
        }

        /* CREAM PROFILE CARD */
        .person-card {
            background-color: var(--card-cream);
            background-image: radial-gradient(circle at 50% 50%, #FFFFFF 0%, #FAF2E6 100%);
            border-radius: 8px;
            border: 1px solid rgba(197, 160, 89, 0.4);
            padding: 35px 20px 28px 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* CARD DOUBLE INNER BORDER */
        .person-card::after {
            content: '';
            position: absolute;
            top: 6px;
            bottom: 6px;
            left: 6px;
            right: 6px;
            border: 1px solid rgba(197, 160, 89, 0.35);
            border-radius: 5px;
            pointer-events: none;
        }

        /* CIRCULAR AVATAR FRAME */
        .avatar-frame {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            padding: 3px;
            background: var(--gold-gradient);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #FFF;
            display: block;
        }

        .role-title {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #7A5B28;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .person-name {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.5rem, 6vw, 3.2rem);
            color: var(--primary-red);
            font-weight: normal;
            margin-bottom: 12px;
            line-height: 1.1;
        }

        /* LEAF / FLOWER DIVIDER ICON */
        .leaf-icon {
            width: 22px;
            height: 22px;
            margin-bottom: 14px;
        }

        .person-quote {
            font-family: 'Cinzel', serif;
            font-style: italic;
            font-size: 0.82rem;
            color: #444444;
            line-height: 1.6;
            max-width: 360px;
        }

        /* --- AI COUPLE PORTRAIT FRAME SECTION --- */
        .couple-portrait-frame {
            background: #FFFFFF;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(197, 160, 89, 0.5);
            position: relative;
            margin: 5px 0;
        }

        .couple-portrait-img {
            width: 100%;
            height: auto;
            border-radius: 2px;
            display: block;
            object-fit: cover;
        }

        /* DECORATIVE CORNER ACCENTS FOR COUPLE FRAME */
        .corner-flower-tl {
            position: absolute;
            top: -12px;
            left: -12px;
            font-size: 1.5rem;
            z-index: 5;
        }

        .corner-leaf-br {
            position: absolute;
            bottom: -10px;
            right: -10px;
            font-size: 1.4rem;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="couple-section" id="couple">
        <!-- SECTION TITLE -->
        <h2 class="couple-heading">THE COUPLE</h2>

        <div class="couple-divider">
            <span>⚜</span>
            <span>◆</span>
            <span>⚜</span>
        </div>

        <p class="couple-tagline">Different Stories, One Beautiful Forever</p>

        <div class="couple-cards-container">
            
            <!-- 1. BRIDE CARD -->
            <div class="person-card">
                <div class="avatar-frame">
                    <!-- AI Illustrated Bride Avatar -->
                    <img class="avatar-img" src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=400&q=80" alt="Danamma - The Bride">
                </div>

                <div class="role-title">THE BRIDE</div>
                <div class="person-name">Danamma</div>

                <!-- Green Leaf SVG Accent -->
                <svg class="leaf-icon" viewBox="0 0 24 24" fill="#6A9A3B">
                    <path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,20.08C12,18 19,13 22,5C22,5 19,4 17,8Z"/>
                </svg>

                <p class="person-quote">"Dreaming of forever and grateful for every blessing that led to this moment"</p>
            </div>

            <!-- 2. AI GENERATED COUPLE PORTRAIT FRAME (MIDDLE IMAGE) -->
            <div class="couple-portrait-frame">
                <span class="corner-flower-tl">🌸</span>
                <!-- Replace src with your generated AI wedding couple illustration image -->
                <img class="couple-portrait-img" src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=800&q=80" alt="Traditional Indian Wedding Couple Illustration">
                <span class="corner-leaf-br">🍃</span>
            </div>

            <!-- 3. GROOM CARD -->
            <div class="person-card">
                <div class="avatar-frame">
                    <!-- AI Illustrated Groom Avatar -->
                    <img class="avatar-img" src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=400&q=80" alt="Kumaresh - The Groom">
                </div>

                <div class="role-title">THE GROOM</div>
                <div class="person-name">Kumaresh</div>

                <!-- Green Leaf SVG Accent -->
                <svg class="leaf-icon" viewBox="0 0 24 24" fill="#6A9A3B">
                    <path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,20.08C12,18 19,13 22,5C22,5 19,4 17,8Z"/>
                </svg>

                <p class="person-quote">"Ready to walk hand in hand, creating endless memories and a lifetime of happiness"</p>
            </div>

        </div>
    </div>

</body>
</html>
