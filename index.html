<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S & R - The Celebration</title>
  
  <!-- Google Fonts for Elegant Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Montserrat:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #5c0612;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(255, 215, 0, 0.18), transparent 45%),
        radial-gradient(circle at 10% 70%, rgba(255, 215, 0, 0.12), transparent 35%),
        linear-gradient(135deg, #42020a 0%, #630815 50%, #330107 100%);
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header {
      width: 100%;
      max-width: 480px;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #fcf9f2;
      box-shadow: 0 3px 12px rgba(0,0,0,0.25);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: #2c2c2c;
    }

    .menu-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      color: #2c2c2c;
      cursor: pointer;
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 480px;
      padding: 25px 18px 80px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    /* Section Header */
    .section-title-container {
      text-align: center;
      color: #f7db8b;
      margin-bottom: 5px;
    }

    .main-title {
      font-family: 'Cinzel', serif;
      font-size: 2.1rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .ornament {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: #d4af37;
      font-size: 0.8rem;
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #ebd188;
      line-height: 1.6;
    }

    /* Cream Card Container */
    .card {
      background: #fdfbf7;
      border-radius: 4px;
      border: 1px solid #e1cf9e;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 0 0 6px #fdfbf7, inset 0 0 0 7px #e1cf9e;
      width: 100%;
      padding: 32px 22px;
      text-align: center;
      position: relative;
    }

    /* Full Traditional Couple Portrait Card Frame */
    .artwork-card {
      background: #ffffff;
      border-radius: 4px;
      padding: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      width: 100%;
    }

    .artwork-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 2px;
    }

    .role-label {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 3px;
      color: #8a6c22;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .person-name {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #382b1c;
      margin-bottom: 12px;
      font-weight: 400;
      line-height: 1.1;
    }

    .leaf-icon {
      width: 22px;
      height: 22px;
      margin: 0 auto 14px auto;
      display: block;
    }

    .quote {
      font-style: italic;
      font-size: 0.9rem;
      color: #555;
      line-height: 1.6;
      font-weight: 300;
      padding: 0 8px;
    }

    /* Floating Music Button */
    .music-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      z-index: 1000;
    }

    .music-btn i {
      font-size: 1rem;
      color: #333;
    }

    /* Sparkles Effect */
    .sparkle {
      position: absolute;
      background: rgba(255, 223, 118, 0.7);
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <div class="logo">S & R</div>
    <button class="menu-btn" aria-label="Toggle Menu">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>

  <main class="container">
    
    <!-- Section Header -->
    <div class="section-title-container">
      <h1 class="main-title">TOGETHER FOREVER</h1>
      <div class="ornament">
        <span>&#10038;</span>
        <span>&#9670;</span>
        <span>&#10038;</span>
      </div>
      <p class="subtitle">JOIN US IN CELEBRATING OUR SPECIAL DAY</p>
    </div>

    <!-- Traditional Couple Artwork Card -->
    <section class="artwork-card">
      <!-- Replace with your actual full couple illustration image URL -->
      <img class="artwork-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 450'><rect width='400' height='450' fill='%23f9ebd2'/><text x='50%' y='48%' dominant-baseline='middle' text-anchor='middle' font-size='20' fill='%235c0612' font-family='sans-serif'>Swapnitha &amp; Ravinandan Illustration</text></svg>" alt="Swapnitha and Ravinandan Traditional Artwork">
    </section>

    <!-- Invitation Details Card -->
    <section class="card">
      <div class="role-label">WEDDING CELEBRATION</div>
      <h2 class="person-name" style="font-size: 2.6rem;">Save The Date</h2>
      
      <!-- Leaf Accent -->
      <svg class="leaf-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3C7 3 3 8 3 13C3 17.5 6.5 21 11 21C11.5 21 12 20.5 12 20C12 15 16 11 21 11C21.5 11 22 10.5 22 10C22 5.5 17.5 3 12 3Z" fill="#71a062"/>
      </svg>

      <p class="quote" style="font-style: normal; font-weight: 400; color: #333;">
        "Two lives, two hearts, joined together in friendship, united forever in love. We request the pleasure of your company as we celebrate our marriage."
      </p>
    </section>

  </main>

  <!-- Floating Audio Button -->
  <button class="music-btn" id="musicToggle" aria-label="Toggle Music">
    <i class="fa-solid fa-music"></i>
  </button>

  <audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Music Toggle
    const musicBtn = document.getElementById('musicToggle');
    const bgMusic = document.getElementById('bgMusic');
    let isPlaying = false;

    musicBtn.addEventListener('click', () => {
      if (isPlaying) {
        bgMusic.pause();
        musicBtn.querySelector('i').className = 'fa-solid fa-music';
      } else {
        bgMusic.play().catch(e => console.log("Audio playback blocked by browser"));
        musicBtn.querySelector('i').className = 'fa-solid fa-pause';
      }
      isPlaying = !isPlaying;
    });

    // Background Sparkles Generator
    function createSparkles() {
      const body = document.body;
      for (let i = 0; i < 20; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        const size = Math.random() * 4 + 2;
        sparkle.style.width = `${size}px`;
        sparkle.style.height = `${size}px`;
        sparkle.style.top = `${Math.random() * 100}%`;
        sparkle.style.left = `${Math.random() * 100}%`;
        sparkle.style.opacity = Math.random() * 0.7 + 0.3;
        body.appendChild(sparkle);
      }
    }

    document.addEventListener('DOMContentLoaded', createSparkles);
  </script>
</body>
</html>
